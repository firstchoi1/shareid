name: Deploy Sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          while IFS='|' read -r APP_NAME APP_DIR APP_PORT; do
            if [ -z "$APP_NAME" ] || [[ "$APP_NAME" == \#* ]]; then
              continue
            fi

            echo "Deploying ${APP_NAME} from ${APP_DIR} on port ${APP_PORT}"

            ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
              "if [ -d '${APP_DIR}/.git' ]; then \
                 cd '${APP_DIR}' && \
                 git pull --ff-only origin main && \
                 bash ./deploy.sh --skip-pull --app-name '${APP_NAME}' --app-port '${APP_PORT}' --app-dir '${APP_DIR}' && \
                 echo 'Deployed ${APP_NAME} at commit:' && \
                 git rev-parse --short HEAD; \
               else \
                 echo 'Missing deployment directory for ${APP_NAME}: ${APP_DIR}' >&2; \
                 exit 1; \
               fi"
          done < deploy/sites.txt
