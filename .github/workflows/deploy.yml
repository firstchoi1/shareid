name: Deploy Sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SITES_CONTENT="$(cat deploy/sites.txt)"

          ssh -T -p "${SSH_PORT:-22}" -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            SITES_CONTENT_B64="$(printf '%s' "$SITES_CONTENT" | base64 | tr -d '\n')" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          REMOTE_SITES_FILE="/etc/shareid/sites.txt"

          decode_sites() {
            if [ -s "$REMOTE_SITES_FILE" ]; then
              cat "$REMOTE_SITES_FILE"
            else
              printf '%s' "$SITES_CONTENT_B64" | base64 -d
            fi
          }

          while IFS='|' read -r APP_NAME APP_DIR APP_PORT || [ -n "${APP_NAME:-}" ]; do
            if [ -z "$APP_NAME" ] || [[ "$APP_NAME" == \#* ]]; then
              continue
            fi

            echo "Deploying ${APP_NAME} from ${APP_DIR} on port ${APP_PORT}"

            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "Missing deployment directory for ${APP_NAME}: ${APP_DIR}" >&2
              exit 1
            fi

            cd "${APP_DIR}"

            for tracked_file in next-env.d.ts package-lock.json; do
              if git ls-files --error-unmatch "$tracked_file" >/dev/null 2>&1; then
                git restore --worktree --staged "$tracked_file" 2>/dev/null || git checkout -- "$tracked_file"
              fi
            done

            BEFORE_REV="$(git rev-parse HEAD)"
            git pull --ff-only origin main
            AFTER_REV="$(git rev-parse HEAD)"
            EXTRA_DEPLOY_ARGS=""
            if ! git diff --quiet "$BEFORE_REV" "$AFTER_REV" -- package.json package-lock.json; then
              EXTRA_DEPLOY_ARGS="--force-install"
            fi

            bash ./deploy.sh --skip-pull --app-name "${APP_NAME}" --app-port "${APP_PORT}" --app-dir "${APP_DIR}" ${EXTRA_DEPLOY_ARGS}
            echo "Deployed ${APP_NAME} at commit:"
            git rev-parse --short HEAD
          done < <(decode_sites)
          REMOTE
